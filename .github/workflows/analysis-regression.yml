# 解析の回帰テスト: 固定の評価セット（クラウドでも取れる CC BY 4.0 の標本）で、再現の距離や打点の位置が
# 基準（analysis/regression_baseline.json）より悪くなっていないかを確かめる。
# 解析の本体（パート分け、打点の合わせ直し、切り出し、キット、鳴らし方、測り方）を変えたときだけ走る（1 回 10 分ほど）。
# 区分 A（CD 曲）は Takahiro の PC にしか無いので、ここでは測れない。
name: analysis-regression

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "analysis/drumeval/extract.py"
      - "analysis/drumeval/nmfd.py"
      - "analysis/drumeval/analyzer.py"
      - "analysis/drumeval/align.py"
      - "analysis/drumeval/metrics.py"
      - "analysis/drumeval/stems.py"
      - "analysis/drumeval/labels.py"
      - "analysis/drumeval/baseline.py"
      - "analysis/run_eval.py"
      - "analysis/check_regression.py"
      - "analysis/regression_baseline.json"
      - "analysis/fetch_egmd_sample.py"
      - "analysis/fetch_stemgmd_sample.py"
      - ".github/workflows/analysis-regression.yml"
  pull_request:
    paths:
      - "analysis/drumeval/extract.py"
      - "analysis/drumeval/nmfd.py"
      - "analysis/drumeval/analyzer.py"
      - "analysis/drumeval/align.py"
      - "analysis/drumeval/metrics.py"
      - "analysis/drumeval/stems.py"
      - "analysis/drumeval/labels.py"
      - "analysis/drumeval/baseline.py"
      - "analysis/run_eval.py"
      - "analysis/check_regression.py"
      - "analysis/regression_baseline.json"
      - "analysis/fetch_egmd_sample.py"
      - "analysis/fetch_stemgmd_sample.py"
      - ".github/workflows/analysis-regression.yml"
  workflow_dispatch:

jobs:
  regression:
    name: ${{ matrix.set }}（基準と比べる）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 取り方は docs/phase0/評価用ステム一覧.md の「クラウドでも使える標本」と同じ（基準の数字はこの標本でのもの）
          - set: stemgmd
            stems: data/stemgmd_stems
            fetch: python analysis/fetch_stemgmd_sample.py --n 12 --out data/stemgmd_stems
          - set: egmd
            stems: data/egmd_stems
            fetch: >-
              python analysis/fetch_egmd_sample.py --n 14 --min-seconds 25 --max-seconds 70
              --kits "Acoustic Kit,Studio (Live Room),Live Rock,Jazz,Arena Stage,Pop-Rock,Funk Rock,808 Simple,909 Simple,Cassette,Big Room,Heavy Metal"
              --out data/egmd_sample --stems-out data/egmd_stems
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r analysis/requirements.txt

      # 評価セット（CC BY 4.0。E-GMD と StemGMD の一部）は、取り方が変わらない限りキャッシュから読む
      - name: Cache the evaluation set
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.stems }}
          key: evalset-${{ matrix.set }}-${{ hashFiles('analysis/fetch_egmd_sample.py', 'analysis/fetch_stemgmd_sample.py', 'analysis/drumeval/align.py') }}

      - name: Fetch the evaluation set
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            if ${{ matrix.fetch }}; then exit 0; fi
            echo "取り直す（$attempt 回目が失敗）"; sleep 20
          done
          exit 1

      - name: Measure
        run: >-
          python analysis/run_eval.py ${{ matrix.stems }} --parts nmfd-oracle
          --json data/results/regression_${{ matrix.set }}.json --out data/results/regression_${{ matrix.set }}.md

      - name: Compare with the baseline
        run: python analysis/check_regression.py data/results/regression_${{ matrix.set }}.json ${{ matrix.set }}

      - name: Upload the tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.set }}
          path: data/results/regression_${{ matrix.set }}.*
