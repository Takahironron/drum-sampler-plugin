# Phase 0: プラグインのビルドと pluginval による検査。
# Windows が本線（計画書 3.7）。Linux はコンパイルの確認、macOS は Phase 5 に備えた確認だけ。
name: build

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["plugin/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["plugin/**", ".github/workflows/build.yml"]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  PLUGINVAL_STRICTNESS: 5
  PLUGINVAL_VERSION: v1.0.4

jobs:
  windows:
    name: Windows (VST3 + pluginval)
    # windows-latest は Windows Server 2025 + Visual Studio 2026 で、"Visual Studio 17 2022" が無い（2026-10-23 確認）。
    # 開発環境（VS 2022）に合わせて windows-2022 を使う。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('plugin/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S plugin -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target DrumSamplerPlugin_VST3 DrumSamplerPlugin_Standalone

      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/${{ env.PLUGINVAL_VERSION }}/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: Run pluginval
        shell: pwsh
        run: |
          $vst3 = "build/DrumSamplerPlugin_artefacts/${{ env.BUILD_TYPE }}/VST3/DrumSamplerPlugin.vst3"
          New-Item -ItemType Directory -Force -Path pluginval-logs | Out-Null
          & "pluginval/pluginval.exe" --strictness-level ${{ env.PLUGINVAL_STRICTNESS }} --validate-in-process --timeout-ms 120000 --output-dir pluginval-logs --validate $vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: DrumSamplerPlugin-windows-vst3
          path: build/DrumSamplerPlugin_artefacts/${{ env.BUILD_TYPE }}/VST3/

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs-windows
          path: pluginval-logs/
          if-no-files-found: ignore

  linux:
    name: Linux (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('plugin/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --target DrumSamplerPlugin_VST3 DrumSamplerPlugin_Standalone

  macos:
    name: macOS (compile check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('plugin/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S plugin -B build -G Xcode

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target DrumSamplerPlugin_VST3 DrumSamplerPlugin_Standalone
