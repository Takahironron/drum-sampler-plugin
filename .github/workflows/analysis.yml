# Phase 0: 採点スクリプトのテスト（analysis/）。
name: analysis

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["analysis/**", ".github/workflows/analysis.yml"]
  pull_request:
    paths: ["analysis/**", ".github/workflows/analysis.yml"]
  workflow_dispatch:

jobs:
  pytest:
    name: Python（採点スクリプトのテスト）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r analysis/requirements.txt
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install -r analysis/requirements-ml.txt
      - run: cd analysis && python -m pytest -q tests
